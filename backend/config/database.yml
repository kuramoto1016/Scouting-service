# PostgreSQL. Versions 9.3 and up are supported.
#
#   Ensure the PG gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "devpassword123") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: scouting_service_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: scouting_service_test

production:
  primary:
    <<: *default
    database: scouting_service_production
  cache:
    <<: *default
    database: scouting_service_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: scouting_service_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: scouting_service_production_cable
    migrations_paths: db/cable_migrate
